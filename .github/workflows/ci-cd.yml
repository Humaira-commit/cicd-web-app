name: CI/CD Pipeline  

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run tests (agar tests hain)
      run: |
        # pytest ya jo bhi aap use karte ho
        python -m pytest || echo "No tests found"

    - name: Build Docker image
      run: |
        docker build -t your-flask-app:latest .
